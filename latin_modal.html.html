<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라틴 영어 — 오늘밤빠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@1,400&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B30;
  --gold:#D4A017;
  --dk:#0d0d0d;
  --dk1:#111;
  --dk2:#161616;
  --dkb:#222;
  --dt:#e8e8e8;
  --dm:#666;
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#f5f5f5;
  min-height:100vh;
}

/* ════════════════════════════
   앱 레이아웃 (기존 프로젝트와 교체)
════════════════════════════ */
.app-wrap{
  max-width:480px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
  position:relative;
}

/* 상단 헤더 */
.app-header{
  display:flex;align-items:center;
  padding:10px 16px;
  border-bottom:1px solid #f0f0f0;
  gap:10px;
  position:sticky;top:0;
  background:#fff;z-index:5;
}
.ham-icon{
  display:flex;flex-direction:column;gap:5px;
  cursor:pointer;padding:4px;
}
.ham-icon span{
  display:block;width:22px;height:2px;
  background:#333;border-radius:1px;
}
.app-logo{
  width:38px;height:38px;
  background:#1a1a1a;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.app-logo-txt{
  font-family:'Bebas Neue',sans-serif;
  font-size:10px;color:#fff;
  letter-spacing:1px;text-align:center;line-height:1.1;
}
.cal-scroll{
  display:flex;flex:1;overflow-x:auto;
}
.cal-scroll::-webkit-scrollbar{display:none}
.cal-day{
  text-align:center;padding:4px 10px;
  min-width:40px;flex-shrink:0;
}
.cal-day .wd{font-size:9px;color:#bbb}
.cal-day .num{font-size:15px;font-weight:500;color:#333;line-height:1.4}
.cal-day.today .wd{color:var(--red)}
.cal-day.today .num{
  background:var(--red);border-radius:50%;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;margin:0 auto;
}
.cal-day.weekend .num{color:var(--red)}

/* 티커 */
.ticker{
  background:#111;color:#eee;
  padding:8px 16px;font-size:12px;
  overflow:hidden;white-space:nowrap;
}

/* 메뉴 리스트 */
.menu-list{padding:4px 0}
.menu-item{
  display:flex;align-items:center;gap:16px;
  padding:15px 20px;
  cursor:pointer;
  border-bottom:1px solid #f8f8f8;
  transition:background 0.15s;
}
.menu-item:hover{background:#fafafa}
.menu-item:active{background:#f5f5f5}
.mi-icon{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.mi-label{font-size:15px;color:#222;flex:1}
.mi-arrow{color:#ccc;font-size:16px}

/* 라틴 영어 아이템 강조 */
.menu-item.latin-item .mi-label{color:var(--red);font-weight:500}
.menu-item.latin-item .mi-arrow{color:var(--red)}

/* ════════════════════════════
   다크 모달 — 라틴 영어
   바이브 코딩 핵심 컴포넌트
════════════════════════════ */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0);
  z-index:100;
  pointer-events:none;
  transition:background 0.3s ease;
}
.overlay.open{
  background:rgba(0,0,0,0.55);
  pointer-events:all;
}

.modal{
  position:fixed;
  bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;
  background:var(--dk1);
  border-radius:20px 20px 0 0;
  max-height:88vh;
  display:flex;flex-direction:column;
  z-index:101;
  transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
}
.modal.open{
  transform:translateX(-50%) translateY(0);
}

.modal-handle{
  width:38px;height:3px;
  background:#2a2a2a;border-radius:2px;
  margin:12px auto 0;flex-shrink:0;
}

.modal-head{
  display:flex;align-items:center;
  padding:14px 18px 12px;
  border-bottom:0.5px solid var(--dkb);
  flex-shrink:0;gap:10px;
}
.modal-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;letter-spacing:2px;
  color:var(--red);flex:1;
}
.modal-count{
  font-size:11px;color:var(--dm);
  letter-spacing:1px;
}
.modal-close{
  width:30px;height:30px;
  background:#1e1e1e;border-radius:50%;
  border:0.5px solid var(--dkb);
  cursor:pointer;color:#888;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;flex-shrink:0;
}
.modal-close:hover{background:#2a2a2a;color:#fff}

/* 검색 */
.m-search{
  padding:10px 16px 8px;
  flex-shrink:0;
}
.m-search input{
  width:100%;
  background:#1a1a1a;
  border:0.5px solid var(--dkb);
  border-radius:22px;
  padding:9px 16px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;color:var(--dt);
  outline:none;
  transition:border-color 0.2s;
}
.m-search input:focus{border-color:var(--red)}
.m-search input::placeholder{color:var(--dm)}

/* 카테고리 */
.m-cats{
  display:flex;gap:6px;
  padding:0 16px 10px;
  overflow-x:auto;flex-shrink:0;
}
.m-cats::-webkit-scrollbar{display:none}
.mcat{
  font-size:11px;letter-spacing:0.5px;
  padding:5px 14px;border-radius:20px;
  border:0.5px solid var(--dkb);
  background:transparent;color:var(--dm);
  cursor:pointer;white-space:nowrap;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.15s;
}
.mcat:hover{border-color:#444;color:#aaa}
.mcat.on{background:var(--red);border-color:var(--red);color:#fff}

/* 카드 목록 */
.m-list{
  flex:1;overflow-y:auto;
  padding:0 16px 24px;
  display:flex;flex-direction:column;gap:6px;
}
.m-list::-webkit-scrollbar{width:3px}
.m-list::-webkit-scrollbar-track{background:transparent}
.m-list::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}

.mcard{
  background:var(--dk2);
  border:0.5px solid var(--dkb);
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  transition:border-color 0.15s;
}
.mcard:hover{border-color:#3a3a3a}
.mcard.active{border-color:var(--red)}
.mcard-top{
  display:flex;align-items:baseline;
  gap:8px;margin-bottom:4px;
}
.mcard-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:12px;color:var(--red);letter-spacing:1px;
}
.mcard-cat{font-size:10px;color:var(--dm)}
.mcard-en{
  font-family:'Playfair Display',serif;
  font-style:italic;font-size:14px;
  color:var(--dt);margin-bottom:3px;line-height:1.4;
}
.mcard-kr{font-size:12px;color:var(--dm)}

/* 상세 패널 (카드 내부 확장) */
.mcard-detail{
  margin:10px -14px -12px;
  padding:10px 14px 12px;
  background:#160808;
  border-top:0.5px solid var(--red);
  border-radius:0 0 10px 10px;
  display:none;
}
.mcard.active .mcard-detail{display:block}
.md-note{
  font-size:11px;color:var(--dm);
  line-height:1.6;margin-bottom:6px;
}
.md-ex{
  font-size:11px;color:var(--gold);
  font-style:italic;line-height:1.5;
}
.md-ex span{
  color:#555;font-style:normal;
  font-size:10px;margin-right:4px;
}

.m-empty{
  text-align:center;padding:40px 20px;
  color:var(--dm);font-size:13px;
}
</style>
</head>
<body>

<div class="app-wrap">

  <!-- 앱 헤더 -->
  <div class="app-header">
    <div class="ham-icon">
      <span></span><span></span><span></span>
    </div>
    <div class="app-logo">
      <div class="app-logo-txt">오늘<br>밤빠</div>
    </div>
    <div class="cal-scroll">
      <div class="cal-day today">
        <div class="wd">오늘</div>
        <div class="num">26</div>
      </div>
      <div class="cal-day"><div class="wd">월</div><div class="num">27</div></div>
      <div class="cal-day"><div class="wd">화</div><div class="num">28</div></div>
      <div class="cal-day"><div class="wd">수</div><div class="num">29</div></div>
      <div class="cal-day"><div class="wd">목</div><div class="num">30</div></div>
      <div class="cal-day"><div class="wd">금</div><div class="num">1</div></div>
      <div class="cal-day weekend"><div class="wd">토</div><div class="num">2</div></div>
      <div class="cal-day weekend"><div class="wd">일</div><div class="num">3</div></div>
    </div>
  </div>

  <!-- 티커 -->
  <div class="ticker">날 떤 마감 임박... 실시간 인원 중계 중! 🕺💃</div>

  <!-- 메뉴 리스트 -->
  <div class="menu-list">
    <div class="menu-item">
      <div class="mi-icon">🌤</div>
      <div class="mi-label">전국 지도 날씨</div>
      <div class="mi-arrow">›</div>
    </div>
    <div class="menu-item">
      <div class="mi-icon">🍴</div>
      <div class="mi-label">뒷풀이 맛집</div>
      <div class="mi-arrow">›</div>
    </div>
    <div class="menu-item">
      <div class="mi-icon">⚡</div>
      <div class="mi-label">부트캠프/워크샵</div>
      <div class="mi-arrow">›</div>
    </div>
    <div class="menu-item">
      <div class="mi-icon">➕</div>
      <div class="mi-label">등록하기 (빠/소셜)</div>
      <div class="mi-arrow">›</div>
    </div>
    <div class="menu-item">
      <div class="mi-icon">➕</div>
      <div class="mi-label">등록하기 (수업/종목)</div>
      <div class="mi-arrow">›</div>
    </div>

    <!-- ★ 라틴 영어 — 클릭 시 모달 오픈 ★ -->
    <div class="menu-item latin-item" id="latinBtn" onclick="openModal()">
      <div class="mi-icon">🅰</div>
      <div class="mi-label">라틴 영어</div>
      <div class="mi-arrow">›</div>
    </div>

    <div class="menu-item">
      <div class="mi-icon">🔔</div>
      <div class="mi-label">공지사항</div>
      <div class="mi-arrow">›</div>
    </div>
  </div>

</div>

<!-- ★ 오버레이 (배경 딤) ★ -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>

<!-- ★ 다크 모달 — 라틴 영어 100 ★ -->
<div class="modal" id="modal">
  <div class="modal-handle"></div>

  <div class="modal-head">
    <span class="modal-title">라틴 영어 100</span>
    <span class="modal-count" id="mCount">100 패턴</span>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>

  <div class="m-search">
    <input type="text" id="mSearch" placeholder="영어 또는 한국어 검색..." oninput="mRender()">
  </div>

  <div class="m-cats" id="mCats"></div>

  <div class="m-list" id="mList"></div>
</div>

<script>
const PATTERNS = [
  {n:1,cat:'인사',en:"Hey, shall we dance?",kr:"같이 춰볼까요?",note:"처음 만난 파트너에게 가장 자연스러운 첫마디",ex:"Hey, shall we dance? I love this song."},

  {n:3,cat:'인사',en:"Is this your first time here?",kr:"여기 처음이에요?",note:"자연스럽게 대화 시작하기",ex:"Is this your first time here? I come every week."},
  {n:4,cat:'인사',en:"I've seen you dance before.",kr:"전에 춤추는 거 봤어요.",note:"기억하고 있다는 표현으로 호감 전달",ex:"I've seen you dance before — you're amazing."},

  {n:6,cat:'댄스요청',en:"Would you like to dance?",kr:"춤 추시겠어요?",note:"격식 있는 댄스 요청",ex:"Excuse me, would you like to dance?"},
  {n:7,cat:'댄스요청',en:"Can I have this dance?",kr:"이 곡 같이 춰요?",note:"클래식하고 로맨틱한 표현",ex:"Can I have this dance? It's my favorite song."},
  {n:8,cat:'댄스요청',en:"Do you want to sit this one out?",kr:"이번 곡은 쉴래요?",note:"파트너가 쉬고 싶어 보일 때",ex:"Do you want to sit this one out?"},
  {n:9,cat:'댄스요청',en:"One more dance?",kr:"한 곡 더 출까요?",note:"좋은 파트너에게 추가 요청",ex:"That was amazing — one more dance?"},

  {n:12,cat:'리드팔로우',en:"I'll go slow, just relax.",kr:"천천히 할게요, 편하게 있으세요.",note:"초보 팔로어를 안심시킬 때",ex:"Don't worry, I'll go slow — just relax."},
  {n:13,cat:'리드팔로우',en:"Can you feel that?",kr:"이거 느껴져요?",note:"바디무브먼트나 리드 신호 확인",ex:"Can you feel that connection?"},

  {n:20,cat:'동작설명',en:"Small steps, please.",kr:"작은 스텝으로 해요.",note:"스텝 크기 조절 요청",ex:"Small steps, please — we're in tight space."},

  {n:33,cat:'실수대처',en:"Let's reset.",kr:"다시 시작해요.",note:"동작 리셋 제안",ex:"Let's reset and catch the next phrase."},
  {n:34,cat:'실수대처',en:"It happens to everyone.",kr:"누구나 그럴 수 있어요.",note:"파트너 실수 위로",ex:"Don't worry — it happens to everyone."},
  {n:35,cat:'실수대처',en:"No worries at all!",kr:"전혀 괜찮아요!",note:"실수를 편하게 넘기기",ex:"No worries at all — just enjoy the music."},

  {n:37,cat:'레벨확인',en:"Are you a beginner or intermediate?",kr:"초급이에요 중급이에요?",note:"직접적으로 레벨 물어보기",ex:"Are you a beginner or intermediate? I'll adjust."},
  {n:38,cat:'레벨확인',en:"I'm still learning.",kr:"아직 배우는 중이에요.",note:"자신의 레벨 겸손하게 표현",ex:"I'm still learning — please be patient!"},
  {n:39,cat:'레벨확인',en:"I've been dancing for two years.",kr:"2년 됐어요.",note:"경력 소개",ex:"I've been dancing for two years — mostly sensual."},

const CATS = ['전체', ...[...new Set(PATTERNS.map(p => p.cat))]];
let curCat = '전체', selId = null;

/* 모달 오픈/클로즈 */
function openModal() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* 렌더 */
function mRender() {
  const q = document.getElementById('mSearch').value.toLowerCase().trim();
  let list = curCat === '전체' ? PATTERNS : PATTERNS.filter(p => p.cat === curCat);
  if (q) list = list.filter(p => p.en.toLowerCase().includes(q) || p.kr.includes(q));

  document.getElementById('mCount').textContent =
    (q || curCat !== '전체') ? list.length + ' 결과' : '100 패턴';

  if (!list.length) {
    document.getElementById('mList').innerHTML =
      '<div class="m-empty">검색 결과가 없어요</div>';
    return;
  }

  document.getElementById('mList').innerHTML = list.map(p => {
    const active = selId === p.n;
    return `
      <div class="mcard${active ? ' active' : ''}" onclick="mSel(${p.n})">
        <div class="mcard-top">
          <span class="mcard-num">#${String(p.n).padStart(2,'0')}</span>
          <span class="mcard-cat">${p.cat}</span>
        </div>
        <div class="mcard-en">"${p.en}"</div>
        <div class="mcard-kr">${p.kr}</div>
        <div class="mcard-detail">
          <div class="md-note">${p.note}</div>
          <div class="md-ex"><span>예시</span>${p.ex}</div>
        </div>
      </div>`;
  }).join('');
}

/* 카드 선택 */
function mSel(n) {
  selId = selId === n ? null : n;
  mRender();
  if (selId) {
    setTimeout(() => {
      const el = document.querySelector('.mcard.active');
      if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 50);
  }
}

/* 카테고리 탭 */
function initCats() {
  document.getElementById('mCats').innerHTML = CATS.map(c =>
    `<button class="mcat${c === curCat ? ' on' : ''}" onclick="mCat('${c}')">${c}</button>`
  ).join('');
}

function mCat(c) {
  curCat = c; selId = null;
  document.querySelectorAll('.mcat').forEach(el =>
    el.classList.toggle('on', el.textContent === c)
  );
  mRender();
  document.getElementById('mList').scrollTop = 0;
}

/* ESC 키로 닫기 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

initCats();
mRender();
</script>
